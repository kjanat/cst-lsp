[project]
name = "cst-lsp"
version = "0.1.4"
description = "LSP Server powered by libcst for refactoring tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Roy Williams", email = "roy.williams.iii@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Text Editors :: Integrated Development Environments (IDE)"
]
dependencies = [
  "libcst>=1.4.0",
  "pygls>=1.3.1, <2.0",
]

[project.scripts]
cst_lsp = "cst_lsp.server:main"

[dependency-groups]
dev = [
  "pyright>=1.1.407",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.2",
  # E2E testing dependencies
  "pytest-lsp>=0.4.0",
  "pytest-asyncio>=0.23.0",
  "deepdiff>=6.0.0",
  "jsonschema>=4.0.0",
  "pytest-benchmark>=4.0.0",
  "pytest-timeout>=2.2.0",
  "pytest-html>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
  "e2e: End-to-end LSP integration tests",
  "slow: Tests taking >5 seconds",
  "benchmark: Performance benchmark tests",
  "requires_ripgrep: Tests requiring ripgrep",
]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
]

[tool.ruff]
# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
